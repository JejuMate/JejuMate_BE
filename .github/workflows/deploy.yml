name: Java CI/CD with Gradle & Docker

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar 

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 도커 이미지 빌드 & 푸시 (EC2용 linux/amd64 강제 지정)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jejumate-be:latest
          platforms: linux/amd64

  deploy-to-ec2:
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > .env
            
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/jejumate-be:latest
            
            sudo docker stop jejumate-server || true
            sudo docker rm jejumate-server || true
            
            sudo docker run -d -p 8080:8080 --name jejumate-server --env-file .env ${{ secrets.DOCKER_USERNAME }}/jejumate-be:latest
            
            sudo docker image prune -f